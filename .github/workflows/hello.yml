
name: Calculator CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions"

  test-calculator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run calculator tests
        run: python -m unittest -v

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile calculator.py
          python -m py_compile test_calculator.py

  build-check:
    runs-on: ubuntu-latest
    needs:
      - test-calculator
      - syntax-check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create build folder
        run: mkdir build

      - name: Copy files
        run: |
          cp calculator.py build/
          cp test_calculator.py build/

      - name: Show build files
        run: ls -la build

  compress-files:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create build folder
        run: |
          mkdir build
          cp calculator.py build/
          cp test_calculator.py build/

      - name: Compress build files
        run: zip -r calculator-app.zip build/

      - name: Show compressed file
        run: ls -lh calculator-app.zip

      - name: Upload compressed file
        uses: actions/upload-artifact@v4
        with:
          name: calculator-app-package
          path: calculator-app.zip
